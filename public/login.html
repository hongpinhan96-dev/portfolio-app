<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理者控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container" style="max-width: 600px;">
    
    <!-- 1. 登入表單 (預設顯示) -->
    <div id="loginCard" class="card p-4 shadow-sm">
      <h3 class="mb-3 text-center">管理者登入</h3>
      <div class="mb-3">
        <label>帳號</label>
        <input type="text" id="username" class="form-control" placeholder="請輸入帳號">
      </div>
      <div class="mb-3">
        <label>密碼</label>
        <input type="password" id="password" class="form-control" placeholder="請輸入密碼">
      </div>
      <button onclick="login()" class="btn btn-primary w-100">登入</button>
      <a href="/" class="btn btn-link text-center mt-2">返回首頁</a>
    </div>

    <!-- 2. 資料修改表單 (登入成功後才顯示) -->
    <div id="editCard" class="card p-4 shadow-sm d-none">
      <h3 class="mb-3 text-center">修改個人簡介資料</h3>
      <div class="mb-3">
        <label>姓名</label>
        <input type="text" id="editName" class="form-control">
      </div>
      <div class="mb-3">
        <label>個人簡介描述</label>
        <textarea id="editBio" class="form-control" rows="4"></textarea>
      </div>
      <button onclick="saveData()" class="btn btn-success w-100 mb-2">儲存修改並更新至資料庫</button>
      <a href="/" class="btn btn-outline-secondary w-100">檢視首頁更新成果</a>
    </div>

  </div>

  <script>
    // 登入邏輯
    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });

      const data = await res.json();
      if (data.success) {
        alert('登入成功！');
        document.getElementById('loginCard').classList.add('d-none');
        document.getElementById('editCard').classList.remove('d-none');
        loadCurrentData();
      } else {
        alert('帳號或密碼錯誤！');
      }
    }

    // 載入目前 MongoDB 裡的舊資料
    async function loadCurrentData() {
      const res = await fetch('/api/profile');
      const data = await res.json();
      if (data) {
        document.getElementById('editName').value = data.name || '';
        document.getElementById('editBio').value = data.bio || '';
      }
    }

    // 儲存新資料至 MongoDB
    async function saveData() {
      const name = document.getElementById('editName').value;
      const bio = document.getElementById('editBio').value;

      const res = await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, bio })
      });

      if (res.ok) {
        alert('資料修改成功！已寫入 MongoDB！');
      } else {
        alert('修改失敗！');
      }
    }
  </script>
</body>
</html>
